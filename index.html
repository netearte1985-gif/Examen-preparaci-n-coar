<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de exámenes</title>
<style>
:root{--azul:#14243a;--fondo:#f1f4fa;--texto:#202938}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);font-family:Arial,sans-serif;color:var(--texto)}
header{background:var(--azul);color:white;padding:38px 24px}
header h1{font-size:36px;margin:0 0 14px}
header p{font-size:19px;line-height:1.5;margin:0;color:#dce5f2}
main{max-width:900px;margin:35px auto;padding:0 18px}
h2{font-size:23px;color:#667386;font-weight:normal}
.tarjeta{background:white;border:1px solid #dce2eb;border-radius:22px;padding:26px;margin:20px 0;box-shadow:0 5px 20px #00000008}
.etiqueta{display:inline-block;background:#e9effb;color:#28558d;padding:9px 15px;border-radius:30px;font-weight:bold}
.tarjeta h3{font-size:25px;margin:18px 0 10px}
.tarjeta p{font-size:18px;color:#667386;line-height:1.5}
.boton{display:inline-block;background:#28599e;color:white;text-decoration:none;padding:16px 24px;border-radius:12px;font-weight:bold;font-size:18px;margin-top:8px}
.boton:active{opacity:.8}
#estado{padding:20px;background:white;border-radius:12px;color:#667386}
footer{text-align:center;padding:25px;color:#667386}
</style>
</head>
<body>

<header>
<h1>Banco de exámenes</h1>
<p>Selecciona el examen que deseas desarrollar. Cada participante verá sus propios resultados en su dispositivo.</p>
</header>

<main>
<h2>Exámenes disponibles</h2>
<div id="lista">
<p id="estado">Buscando automáticamente los exámenes...</p>
</div>
</main>

<footer>Banco de exámenes</footer>

<script>
async function cargarExamenes(){
 const lista=document.getElementById("lista");
 const owner=location.hostname.split(".")[0];
 const repo=decodeURIComponent(location.pathname.split("/").filter(Boolean)[0]||"");

 try{
  const respuesta=await fetch(
   `https://api.github.com/repos/${owner}/${encodeURIComponent(repo)}/contents/`
  );

  if(!respuesta.ok) throw new Error("No se pudo consultar el repositorio.");

  const archivos=await respuesta.json();

  const examenes=archivos.filter(a=>
   a.type==="file" &&
   a.name.toLowerCase().endsWith(".html") &&
   a.name.toLowerCase()!=="index.html"
  );

  lista.innerHTML="";

  if(examenes.length===0){
   lista.innerHTML="<p id='estado'>Todavía no hay exámenes disponibles.</p>";
   return;
  }

  examenes.sort((a,b)=>a.name.localeCompare(b.name,"es"));

  examenes.forEach((archivo,i)=>{
   const nombre=archivo.name
    .replace(/\.html$/i,"")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

   const tarjeta=document.createElement("section");
   tarjeta.className="tarjeta";

   const etiqueta=document.createElement("span");
   etiqueta.className="etiqueta";
   etiqueta.textContent="EXAMEN "+(i+1);

   const titulo=document.createElement("h3");
   titulo.textContent=nombre;

   const descripcion=document.createElement("p");
   descripcion.textContent="Examen interactivo disponible.";

   const enlace=document.createElement("a");
   enlace.className="boton";
   enlace.href="./"+encodeURIComponent(archivo.name);
   enlace.textContent="Abrir examen";

   tarjeta.append(etiqueta,titulo,descripcion,enlace);
   lista.appendChild(tarjeta);
  });

 }catch(error){
  lista.innerHTML="<p id='estado'>No se pudieron cargar los exámenes. Comprueba tu conexión e inténtalo nuevamente.</p>";
 }
}

cargarExamenes();
</script>

</body>
</html>
